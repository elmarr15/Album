<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Picture Album</title>
    <link rel="stylesheet" href="album design.css">
    <style>
        /* =========================
           NOTIFICATION MODAL STYLES
        ========================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-box h3 {
            margin-top: 0;
            color: #253850;
            font-size: 20px;
        }

        .modal-box p {
            color: #555555;
            font-style: italic;
            line-height: 1.6;
            margin: 20px 0;
            font-size: 16px;
        }

        .modal-box button {
            background-color: #ff7a59;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .modal-box button:hover {
            background-color: #e66242;
        }
    </style>
</head>

<body>

    <!-- SYSTEM NOTIFICATION MODAL -->
    <div class="modal-overlay" id="prayerModal">
        <div class="modal-box">
           
            <p>"Grant me, Oh Lord, a steady hand and a watchful eye so that no one shall be hurt as I pass by."</p>
            <button id="closeModalBtn">Amen</button>
        </div>
    </div>

    <!-- TOP HEADER WITH HAMBURGER MENU -->
    <header class="app-header">
        <div class="menu-container">
            <button class="hamburger-btn" id="menuToggle" aria-label="Toggle Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="Album.html" class="menu-item active">Pictures</a>
                <a href="Videos.html" class="menu-item">Videos</a>
                <a href="#" class="menu-item logout" id="logoutBtn">Logout</a>
            </div>
        </div>

        <div class="header-title-container">
            <h1 class="main-title">🕊️ MEMORIES OF RAMIL 🕊️</h1>
            <div class="title-underline"></div>
        </div>
    </header>

    <!-- PHOTO GRID CONTAINER -->
    <div class="Acontainer">
        <div class="Agrid" id="PhotoGrid"></div>
    </div>


    <script>
        // Require login
        if (sessionStorage.getItem("authenticated") !== "true") {
            window.location.replace("index.html");
        }

        // System Notification Modal Logic (First Login Check)
        const prayerModal = document.getElementById("prayerModal");
        const closeModalBtn = document.getElementById("closeModalBtn");

        if (!sessionStorage.getItem("prayerShown")) {
            prayerModal.classList.add("active");
        }

        closeModalBtn.addEventListener("click", () => {
            prayerModal.classList.remove("active");
            sessionStorage.setItem("prayerShown", "true");
        });

        // Toggle Hamburger Menu
        const menuToggle = document.getElementById("menuToggle");
        const dropdownMenu = document.getElementById("dropdownMenu");

        menuToggle.addEventListener("click", (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle("show");
        });

        // Close menu when clicking outside
        document.addEventListener("click", (e) => {
            if (!dropdownMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                dropdownMenu.classList.remove("show");
            }
        });

        // Logout functionality
        document.getElementById("logoutBtn").addEventListener("click", (e) => {
            e.preventDefault();
            sessionStorage.removeItem("authenticated");
            sessionStorage.removeItem("prayerShown"); // Resets prayer status on logout
            window.location.replace("index.html");
        });

        // Generate photos
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("PhotoGrid");

            for (let i = 1; i <= 259; i++) {
                const item = document.createElement("div");
                item.className = "photos";

                item.innerHTML = `
                    <div class="frame">
                        <img src="Images/${i}.jpg" alt="Photo ${i}">
                    </div>
                    <button class="dl">DOWNLOAD</button>
                `;

                item.querySelector(".dl").onclick = async () => {
                    try {
                        const img = item.querySelector("img");
                        const response = await fetch(img.src);
                        const blob = await response.blob();

                        const url = URL.createObjectURL(blob);
                        const link = document.createElement("a");

                        link.href = url;
                        link.download = `Photo-${i}.jpg`;
                        link.click();

                        URL.revokeObjectURL(url);
                    } catch (error) {
                        console.error("Download failed:", error);
                    }
                };

                grid.appendChild(item);
            }
        });
    </script>

</body>

</html>
