<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Picture Album</title>
    <link rel="stylesheet" href="album design.css">
</head>

<body>

    <!-- TOP HEADER WITH HAMBURGER MENU -->
    <header class="app-header">
        <div class="menu-container">
            <button class="hamburger-btn" id="menuToggle" aria-label="Toggle Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="Album.html" class="menu-item active">Pictures</a>
                <a href="Videos.html" class="menu-item">Videos</a>
                <a href="#" class="menu-item logout" id="logoutBtn">Logout</a>
            </div>
        </div>

        <div class="header-title-container">
            <h1 class="main-title">MEMORIES OF RAMIL</h1>
            <div class="title-underline"></div>
        </div>
    </header>

    <!-- PHOTO GRID CONTAINER -->
    <div class="Acontainer">
        <div class="Agrid" id="PhotoGrid"></div>
    </div>


    <script>
        // Require login
        if (sessionStorage.getItem("authenticated") !== "true") {
            window.location.replace("index.html");
        }

        // Toggle Hamburger Menu
        const menuToggle = document.getElementById("menuToggle");
        const dropdownMenu = document.getElementById("dropdownMenu");

        menuToggle.addEventListener("click", (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle("show");
        });

        // Close menu when clicking outside
        document.addEventListener("click", (e) => {
            if (!dropdownMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                dropdownMenu.classList.remove("show");
            }
        });

        // Logout functionality
        document.getElementById("logoutBtn").addEventListener("click", (e) => {
            e.preventDefault();
            sessionStorage.removeItem("authenticated");
            window.location.replace("index.html");
        });

        // Generate photos
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("PhotoGrid");

            for (let i = 1; i <= 259; i++) {
                const item = document.createElement("div");
                item.className = "photos";

                item.innerHTML = `
                    <div class="frame">
                        <img src="Images/${i}.jpg" alt="Photo ${i}">
                    </div>
                    <button class="dl">DOWNLOAD</button>
                `;

                item.querySelector(".dl").onclick = async () => {
                    try {
                        const img = item.querySelector("img");
                        const response = await fetch(img.src);
                        const blob = await response.blob();

                        const url = URL.createObjectURL(blob);
                        const link = document.createElement("a");

                        link.href = url;
                        link.download = `Photo-${i}.jpg`;
                        link.click();

                        URL.revokeObjectURL(url);
                    } catch (error) {
                        console.error("Download failed:", error);
                    }
                };

                grid.appendChild(item);
            }
        });
    </script>

</body>

</html>
